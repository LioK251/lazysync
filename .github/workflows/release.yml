name: Release installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to rebuild for the current version
        type: choice
        default: all
        options: [all, macos, windows]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; fi
          test "$TAG" = "v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "lazysync $VERSION" --notes-file docs/RELEASE_NOTES.md
          fi
          ID=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'macos' && '[{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"dmg"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","bundles":"dmg"}]' || inputs.platform == 'windows' && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"},{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"dmg"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","bundles":"dmg"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run test:rust
      - run: npm run check
      - run: npm test
      - name: Load signing credentials only when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!key}" ]]; then
              delimiter="lazysync_${RANDOM}_${RANDOM}"
              { printf '%s<<%s\n' "$key" "$delimiter"; printf '%s\n' "${!key}"; printf '%s\n' "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done
      - name: Build and attach installers to draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENSSL_STATIC: '1'
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify macOS app does not depend on Homebrew libraries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dependencies=$(otool -L "src-tauri/target/${{ matrix.target }}/release/lazysync")
          printf '%s\n' "$dependencies"
          if printf '%s\n' "$dependencies" | grep -Eq '/opt/homebrew|/usr/local/opt'; then
            echo 'Unexpected Homebrew runtime dependency in app bundle.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lazysync-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all installers and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt
          grep -q '\.exe$' assets.txt
          grep -q 'aarch64.*\.dmg$' assets.txt
          grep -q 'x64.*\.dmg$' assets.txt
          gh release edit "$TAG" --draft=false
