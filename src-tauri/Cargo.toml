[package]
name = "lazysync"
version = "0.2.1"
description = "A careful repository sync companion"
edition = "2021"
rust-version = "1.85"

[lib]
name = "lazysync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lazysync"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-compat"] }
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
notify = "8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
zeroize = "1"

[dev-dependencies]
tiny_http = "0.12"
